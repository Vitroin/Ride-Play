# Deploys the app to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # New cache name per deploy, so phones pick up the update on next open.
      - name: Stamp service-worker version
        run: sed -i "s/motodash-v1/motodash-${GITHUB_SHA::7}/" sw.js

      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html styles.css config.js sw.js manifest.webmanifest js icons vendor _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
